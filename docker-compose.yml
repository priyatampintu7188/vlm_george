version: '3.8'

services:
  # FastAPI Backend
  backend:
    build: ./backend
    container_name: vlm_backend
    ports:
      - "8000:8000"
    volumes:
      - vlm_chat_data:/app/data
    environment:
      # Use the docker host IP to reach local Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # React+Vite Frontend
  frontend:
    build: ./vlm_diagram_ui
    container_name: vlm_frontend
    ports:
      - "7860:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vlm_chat_data:
